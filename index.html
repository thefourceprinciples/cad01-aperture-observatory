<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAD-01 Interactive 3D Aperture & Origami Studio</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="studio/style.css" />
</head>
<body>
  <div id="sidebar">
    <div>
      <h1>CAD-01 3D Studio</h1>
      <p class="sub">Interactive Spirograph-to-Kagome &amp; Kresling Origami Generator (<code>C = O × E × H × X</code>)</p>
    </div>

    <div class="control-group">
      <label>Active 3D Model</label>
      <select id="modelSelect">
        <option value="assembly">Full Gate Assembly (O + E + H)</option>
        <option value="kagome">Kagome Aperture Gate (O)</option>
        <option value="phase">Rotating Spirograph Mask (E)</option>
        <option value="kresling">2-Story Kresling Collar (H)</option>
      </select>
      <label style="margin-top:4px; cursor:pointer;">
        <span>Show 40 kHz Wave Simulation</span>
        <input type="checkbox" id="waveToggle" checked />
      </label>
    </div>

    <div class="control-group">
      <label>Spirograph Lobes (R/r) <span class="val" id="lobesVal">6</span></label>
      <input type="range" id="lobesSlider" min="3" max="12" step="1" value="6" />

      <label>Strut / Rib Width (mm) <span class="val" id="strutVal">2.0</span></label>
      <input type="range" id="strutSlider" min="1.0" max="4.0" step="0.2" value="2.0" />

      <label>Phase Mask Rotation (E°) <span class="val" id="rotVal">0°</span></label>
      <input type="range" id="rotSlider" min="0" max="360" step="1" value="0" />

      <label>Origami Compression (H) <span class="val" id="compVal">0%</span></label>
      <input type="range" id="compSlider" min="0" max="100" step="1" value="0" />
    </div>

    <div class="control-group metrics" id="metricsBox">
      Tube ID: 75.0 mm | Halo OD: 88.0 mm<br/>
      Coupled Twist Δφ: 0.0°<br/>
      Coherence C: 0.00 | CLOSED
    </div>

    <button class="primary" id="exportBtn">Download Active .STL File</button>
  </div>

  <div id="viewport">
    <canvas id="canvas3d" style="width:100%; height:100%; display:block;"></canvas>
    <div id="hud">Left-Drag: Orbit 3D | Scroll: Zoom | Zero-CDN Engine</div>
  </div>

  <script src="studio/mesh.js"></script>
  <script src="studio/app.js"></script>
</body>
</html>
